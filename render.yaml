services:
  - type: web
    name: bibig-api
    runtime: node
    plan: free
    # TypeScript compilation needs the @types packages in devDependencies.
    buildCommand: npm ci --include=dev && npm run backend:build
    startCommand: npm run start --workspace=backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: CORS_ORIGINS
        sync: false
